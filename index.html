<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Daily Log</title>
<style>
:root{--bg:#1e1e1e;--card:#1e1e1e;--line:#333335;--tx:#e6e6e6;--mut:#8a8a8e;--ac:#5c5c60;--hi:#2c2c2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(30,30,30,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .grp{display:flex;gap:6px;align-items:center;padding-right:10px;margin-right:2px;border-right:1px solid var(--line)}
.bar .grp:last-child{border:0}
button{background:#2a2a2c;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font:inherit;font-size:14px;cursor:pointer}
button:hover{border-color:var(--ac)}
.emo{font-size:18px;padding:3px 10px}
.lbl{font-size:12px;color:var(--mut)}
input[type=date]{background:#2a2a2c;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:14px;color-scheme:dark}
main{max-width:860px;margin:0 auto;padding:16px 14px 80px}
details{border:0;border-bottom:1px solid #2a2a2c;margin:0;border-radius:0;background:none}
details.today>summary{background:var(--hi);border-radius:8px}
summary{cursor:pointer;padding:12px 12px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;list-style:none;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--mut);transition:transform .15s;display:inline-block}
details[open]>summary::before{transform:rotate(90deg)}
.badge{font-size:11px;font-weight:700;background:#4a4a4e;color:#e6e6e6;border-radius:99px;padding:1px 9px}
.del{margin-left:auto;font-size:12px;padding:2px 8px;color:var(--mut);background:none;border:0}
.del:hover{color:#ff6b6b}.del.sure{color:#ff6b6b;font-weight:700}
.ed{padding:6px 12px 20px;outline:none;min-height:80px}
.ed ul{margin:2px 0;padding-left:26px;list-style:none}
.ed li{position:relative}
.ed li::before{content:"–";position:absolute;left:-18px;color:var(--mut)}
.ed ul ul{padding-left:22px}
.ed s,.ed strike{color:var(--mut)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style></head><body>
<div class="bar">
  <div class="grp">
    <button data-c="bold" title="Bold (Ctrl/Cmd+B)"><b>B</b></button>
    <button data-c="italic" title="Italic (Ctrl/Cmd+I)"><i>I</i></button>
    <button data-c="strikeThrough" title="Strikethrough (Ctrl/Cmd+Shift+X)"><s>S</s></button>
    <button data-c="insertUnorderedList" title="Dash list">– List</button>
  </div>
  <div class="grp"><span class="lbl">Checks (click = insert + copy)</span>
    <button class="emo" data-e="😑">😑</button><button class="emo" data-e="✅">✅</button><button class="emo" data-e="❌">❌</button>
  </div>
  <div class="grp"><button id="goToday">Today</button>
    <input type="date" id="newDate"><button id="addDay">+ Add day</button></div>
  <div class="grp"><button id="exp">Export</button><button id="imp">Import</button><input type="file" id="file" accept=".json" hidden></div>
</div>
<main id="list"></main>
<div class="toast" id="toast"></div>
<script>
const KEY='daily-log-v1';
let data={};
try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){data={}}
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const now=new Date(), todayK=iso(now), yest=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1), yestK=iso(yest);
const label=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}).replace(',','')};
const TPL='<div><b>Tdy:</b></div><ul><li><br></li></ul><div><br></div><div><b>Tmr:</b></div><ul><li><br></li></ul><div><br></div>';
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
let timer;const saveSoon=()=>{clearTimeout(timer);timer=setTimeout(save,300)};
if(data[todayK]==null)data[todayK]=TPL;
if(data[yestK]==null)data[yestK]=TPL;
save();
let lastEd=null;
const list=document.getElementById('list');
function render(){
  list.innerHTML='';
  Object.keys(data).sort().reverse().forEach(k=>{
    const det=document.createElement('details');det.dataset.k=k;
    if(k===todayK)det.className='today';
    if(k===todayK||k===yestK)det.open=true;
    const sum=document.createElement('summary');
    sum.innerHTML='<span>'+label(k)+'</span>'+(k===todayK?'<span class="badge">TODAY</span>':'');
    const del=document.createElement('button');del.className='del';del.textContent='delete';
    let armed=0;
    del.onclick=e=>{e.preventDefault();e.stopPropagation();
      if(!armed){armed=1;del.textContent='click again to delete';del.classList.add('sure');
        setTimeout(()=>{armed=0;del.textContent='delete';del.classList.remove('sure')},3000);return}
      delete data[k];save();render();toast('Deleted')};
    sum.appendChild(del);
    const ed=document.createElement('div');ed.className='ed';ed.contentEditable='true';ed.spellcheck=true;
    ed.innerHTML=data[k];
    ed.oninput=()=>{data[k]=ed.innerHTML;saveSoon()};
    ed.onfocus=()=>lastEd=ed;
    ed.onkeydown=e=>{
      const m=e.metaKey||e.ctrlKey;
      if(m&&e.shiftKey&&e.key.toLowerCase()==='x'){e.preventDefault();document.execCommand('strikeThrough')}
      if(e.key==='Tab'){e.preventDefault();document.execCommand(e.shiftKey?'outdent':'indent')}
    };
    det.append(sum,ed);list.appendChild(det);
  });
}
render();
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1400)}
document.querySelectorAll('.bar button').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{document.execCommand(b.dataset.c);if(lastEd)lastEd.dispatchEvent(new Event('input'))});
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{
  const e=b.dataset.e;
  const sel=getSelection();
  if(lastEd&&sel.rangeCount&&lastEd.contains(sel.anchorNode))document.execCommand('insertText',false,e);
  try{navigator.clipboard.writeText(e).then(()=>toast('Copied '+e),()=>toast('Inserted '+e))}catch(x){toast('Inserted '+e)}
});
document.getElementById('goToday').onclick=()=>{
  const d=list.querySelector('[data-k="'+todayK+'"]');d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'});
};
document.getElementById('addDay').onclick=()=>{
  const v=document.getElementById('newDate').value;if(!v)return toast('Pick a date first');
  if(data[v]==null){data[v]=TPL;save();render()}
  const d=list.querySelector('[data-k="'+v+'"]');d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'});
};
document.getElementById('exp').onclick=()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  a.download='daily-log-backup-'+todayK+'.json';a.click();
};
document.getElementById('imp').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{try{Object.assign(data,JSON.parse(t));save();render();toast('Imported')}catch(x){toast('Bad file')}});
};
</script>
</body></html>
